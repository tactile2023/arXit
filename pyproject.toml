[project]
name = "arxit"
version = "0.5.0"
description = "An evidence-backed integrity and reproducibility auditor for machine-learning papers on arXiv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "pypdf>=6.16,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
arxit = "arxit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0",]
